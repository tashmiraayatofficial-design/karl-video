<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karl Bushby — 30s Daylight Satellite Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-space: #060b16;
      --ocean-deep: #0b1a36;
      --route-yellow: #ffd600;
      --alert-red: #e53935;
      --jungle-green: #00e676;
      --water-blue: #29b6f6;
      --text-white: #ffffff;
      --glass-bg: rgba(11, 19, 43, 0.84);
      --glass-border: rgba(255, 255, 255, 0.24);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: #050811;
      color: #fff;
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    body.render-mode {
      background: #000;
      display: block;
      width: 1080px;
      height: 1920px;
    }

    #viewport-shell {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--bg-space);
      transform-origin: top center;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.75);
    }

    body.render-mode #viewport-shell {
      transform: none !important;
      box-shadow: none;
    }

    /* Stage Layers */
    .layer {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }

    /* Flat World Map Layer (4000x2000 Equirectangular) */
    #flat-map-layer {
      background: var(--ocean-deep);
      perspective: 1100px;
      opacity: 0;
    }

    #flat-tilt-wrap {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transform-origin: 540px 800px;
    }

    #flat-camera {
      position: absolute;
      top: 0;
      left: 0;
      width: 4000px;
      height: 2000px;
      transform-origin: 0 0;
      will-change: transform;
    }

    #flat-map-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 4000px;
      height: 2000px;
      object-fit: cover;
      filter: brightness(1.22) contrast(1.08) saturate(1.18);
    }

    #flat-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 4000px;
      height: 2000px;
      overflow: visible;
    }

    /* Tactical Grid Overlay for 3D Tilt Rules Scene */
    #tactical-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(41, 182, 246, 0.14) 2px, transparent 2px),
        linear-gradient(90deg, rgba(41, 182, 246, 0.14) 2px, transparent 2px);
      background-size: 90px 90px;
      opacity: 0;
      pointer-events: none;
    }

    /* 3D Globe Layer (BlueMarble_2005_SAm_09_4096.jpg) */
    #globe-layer {
      background: radial-gradient(circle at 50% 38%, #10254a 0%, #060b16 68%, #02040a 100%);
      opacity: 0;
    }

    #globe-camera {
      position: absolute;
      top: 220px;
      left: 40px;
      width: 1000px;
      height: 1000px;
      transform-origin: 500px 500px;
      will-change: transform;
    }

    #globe-img {
      width: 1000px;
      height: 1000px;
      border-radius: 50%;
      object-fit: cover;
      filter: brightness(1.16) contrast(1.06) saturate(1.15);
      box-shadow: 0 0 70px rgba(41, 182, 246, 0.35), inset 0 0 30px rgba(255, 255, 255, 0.12);
    }

    #globe-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 1000px;
      height: 1000px;
      overflow: visible;
    }

    /* Subtle Cinematic Vignette */
    #vignette {
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 42%, transparent 50%, rgba(4, 8, 20, 0.62) 100%);
    }

    /* HUD & Motion Overlays (Strictly X: 90-990, Y: 210-1360) */
    #hud-layer {
      pointer-events: none;
    }

    .badge-pill {
      position: absolute;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 18px 36px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 3px solid var(--glass-border);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0;
    }

    .badge-red {
      background: var(--alert-red);
      border-color: #ffffff;
      color: #ffffff;
    }

    .badge-green {
      background: #059669;
      border-color: var(--jungle-green);
      color: #ffffff;
    }

    .badge-yellow {
      background: var(--route-yellow);
      border-color: #ffffff;
      color: #0b132b;
    }

    /* S1 Hexagon Reveal */
    #s1-hex-wrap {
      position: absolute;
      left: 540px;
      top: 560px;
      width: 420px;
      height: 460px;
      margin-left: -210px;
      margin-top: -230px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    #s1-28-badge {
      left: 540px;
      top: 860px;
      transform: translate(-50%, 0);
      font-size: 64px;
      padding: 20px 52px;
      border-radius: 26px;
    }

    #s1-sub-pill {
      left: 540px;
      top: 1005px;
      transform: translate(-50%, 0);
      font-size: 32px;
      color: #e2e8f0;
    }

    /* S2 Karl Avatar & Bio */
    #s2-avatar-card {
      position: absolute;
      left: 540px;
      top: 520px;
      width: 280px;
      height: 280px;
      margin-left: -140px;
      margin-top: -140px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1e3a8a, #0f172a);
      border: 8px solid #ffffff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    #s2-name-pill {
      left: 540px;
      top: 720px;
      transform: translate(-50%, 0);
      font-size: 46px;
      color: var(--route-yellow);
    }

    #s2-role-pill {
      left: 540px;
      top: 830px;
      transform: translate(-50%, 0);
      font-size: 28px;
      color: #ffffff;
    }

    /* S3 Chile 1998 */
    #s3-year-badge {
      left: 540px;
      top: 250px;
      transform: translate(-50%, 0);
      font-size: 54px;
      padding: 18px 48px;
    }

    #s3-place-pill {
      left: 540px;
      top: 375px;
      transform: translate(-50%, 0);
      font-size: 32px;
      color: var(--route-yellow);
    }

    /* S4 Expedition Cart + Budget Cards */
    #s4-row {
      position: absolute;
      left: 90px;
      top: 300px;
      width: 900px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      opacity: 0;
    }

    .stat-card {
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 28px 36px;
      border-radius: 28px;
      background: var(--glass-bg);
      border: 3px solid var(--glass-border);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55);
      opacity: 0;
    }

    .stat-icon {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      background: rgba(255, 214, 0, 0.16);
      border: 2px solid var(--route-yellow);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stat-text-main {
      font-size: 38px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
    }

    .stat-text-sub {
      font-size: 24px;
      font-weight: 700;
      color: #93c5fd;
      margin-top: 4px;
    }

    /* S5 Destination Hull */
    #s5-dest-pill {
      left: 540px;
      top: 240px;
      transform: translate(-50%, 0);
      font-size: 36px;
    }

    /* S6 Rules Slam Icons */
    #s6-title-pill {
      left: 540px;
      top: 250px;
      transform: translate(-50%, 0);
      font-size: 46px;
    }

    #s6-icons-row {
      position: absolute;
      left: 90px;
      top: 520px;
      width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slam-hex {
      width: 260px;
      height: 280px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    #s6-foot-card {
      left: 540px;
      top: 930px;
      transform: translate(-50%, 0);
      font-size: 40px;
      padding: 24px 48px;
    }

    /* S7 Colombia 2001 */
    #s7-year-badge {
      left: 540px;
      top: 240px;
      transform: translate(-50%, 0);
      font-size: 46px;
      padding: 18px 44px;
    }

    /* Reserved Empty Subtitle Zone Guide (Preview Only) */
    #subtitle-safe-guide {
      position: absolute;
      left: 90px;
      top: 1400px;
      width: 900px;
      height: 440px;
      border: 4px dashed rgba(255, 214, 0, 0.7);
      border-radius: 24px;
      background: rgba(255, 214, 0, 0.08);
      display: none;
      align-items: center;
      justify-content: center;
      color: #ffd600;
      font-size: 30px;
      font-weight: 800;
      text-align: center;
      pointer-events: none;
    }

    /* Preview Toolbar (Hidden in ?render=1) */
    #preview-bar {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 14px;
      border-radius: 16px;
      z-index: 999;
      max-width: 96vw;
    }

    body.render-mode #preview-bar {
      display: none !important;
    }

    #preview-bar button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    #preview-bar button.alt {
      background: #334155;
    }

    #time-slider {
      width: 180px;
      accent-color: #ffd600;
    }

    #time-label {
      font-size: 13px;
      font-weight: 700;
      color: #ffd600;
      min-width: 78px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="viewport-shell">
    <!-- LAYER 1: Flat Equirectangular Satellite Map (S2-S6) -->
    <div id="flat-map-layer" class="layer">
      <div id="flat-tilt-wrap">
        <div id="flat-camera">
          <img id="flat-map-img" src="assets/images/world.200407.3x21600x10800.jpg" alt="World Map" />
          <svg id="flat-svg" viewBox="0 0 4000 2000">
            <defs>
              <filter id="glow-yellow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="6" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            <!-- Chile Highlight Polygon (GPS mapped to 4000x2000) -->
            <polygon
              id="chile-poly"
              points="1220,1200 1236,1208 1228,1360 1216,1490 1225,1596 1205,1608 1192,1550 1198,1410 1206,1260"
              fill="#e53935"
              fill-opacity="0"
              stroke="#ffffff"
              stroke-width="4"
              stroke-opacity="0"
            />

            <!-- Forecast Dashed Arc: Punta Arenas (1212,1591) -> Hull, England (1996,403) -->
            <path
              id="forecast-arc"
              d="M 1212 1591 Q 1420 820 1996 403"
              fill="none"
              stroke="#ffffff"
              stroke-width="10"
              stroke-dasharray="22 18"
              stroke-linecap="round"
              opacity="0"
            />

            <!-- Punta Arenas Pin -->
            <g id="pin-punta" opacity="0" transform="translate(1212, 1591)">
              <circle r="34" fill="none" stroke="#ffd600" stroke-width="5" id="pin-punta-ring" />
              <circle r="14" fill="#ffd600" stroke="#ffffff" stroke-width="4" />
            </g>

            <!-- Hull England Pin -->
            <g id="pin-hull" opacity="0" transform="translate(1996, 403)">
              <circle r="44" fill="none" stroke="#ffd600" stroke-width="6" id="pin-hull-ring" />
              <circle r="18" fill="#ffd600" stroke="#ffffff" stroke-width="5" />
            </g>
          </svg>
        </div>
      </div>
      <div id="tactical-grid"></div>
    </div>

    <!-- LAYER 2: 3D South America Globe (S1 & S7) -->
    <div id="globe-layer" class="layer">
      <div id="globe-camera">
        <img id="globe-img" src="assets/images/BlueMarble_2005_SAm_09_4096.jpg" alt="South America Globe" />
        <svg id="globe-svg" viewBox="0 0 1000 1000">
          <defs>
            <filter id="globe-glow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="5" result="b" />
              <feMerge>
                <feMergeNode in="b" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          <!-- Colombia Neon Green Region Highlight -->
          <polygon
            id="colombia-poly"
            points="392,250 432,248 455,286 438,325 396,312 378,282"
            fill="#00e676"
            fill-opacity="0"
            stroke="#ffffff"
            stroke-width="4"
            stroke-opacity="0"
          />

          <!-- Glowing Yellow Route: Punta Arenas -> Andes -> Colombia -->
          <path
            id="sa-route"
            d="M 465 842 C 446 775, 434 705, 428 635 C 424 575, 402 520, 376 468 C 356 425, 355 375, 378 330 C 392 302, 405 286, 412 272"
            fill="none"
            stroke="#ffd600"
            stroke-width="11"
            stroke-linecap="round"
            filter="url(#globe-glow)"
            opacity="0"
          />

          <!-- Moving Karl Avatar Marker on Globe Route -->
          <g id="globe-avatar" opacity="0" transform="translate(465, 842)">
            <circle r="30" fill="#0b132b" stroke="#ffffff" stroke-width="5" />
            <circle cx="0" cy="-7" r="8" fill="#ffd600" />
            <path d="M -12 14 C -10 4, 10 4, 12 14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
          </g>

          <!-- Colombia Target Pin -->
          <g id="pin-colombia" opacity="0" transform="translate(412, 272)">
            <circle r="36" fill="none" stroke="#00e676" stroke-width="5" id="pin-colombia-ring" />
            <circle r="12" fill="#00e676" stroke="#ffffff" stroke-width="4" />
          </g>
        </svg>
      </div>
    </div>

    <!-- Vignette -->
    <div id="vignette" class="layer"></div>

    <!-- LAYER 3: HUD Motion Overlays (Safe Zone X: 90-990, Y: 210-1360) -->
    <div id="hud-layer" class="layer">
      <!-- S1: Hexagon Frame + 28 YEARS -->
      <div id="s1-hex-wrap">
        <svg viewBox="0 0 220 240" width="380" height="415">
          <polygon
            points="110,10 206,65 206,175 110,230 14,175 14,65"
            fill="rgba(11,19,43,0.82)"
            stroke="#ffffff"
            stroke-width="8"
          />
          <!-- Stylized Walking Boot + Compass Icon -->
          <circle cx="110" cy="120" r="62" fill="rgba(255,214,0,0.12)" stroke="#ffd600" stroke-width="3" stroke-dasharray="8 6" />
          <path d="M88 84 L112 84 L116 122 L148 134 C154 136 156 144 152 149 L82 149 L82 90 Z" fill="#ffd600" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
          <line x1="78" y1="158" x2="156" y2="158" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
        </svg>
      </div>
      <div id="s1-28-badge" class="badge-pill badge-red">28 YEARS</div>
      <div id="s1-sub-pill" class="badge-pill">WALKING HOME</div>

      <!-- S2: Karl Bushby Avatar -->
      <div id="s2-avatar-card">
        <svg viewBox="0 0 160 160" width="200" height="200">
          <!-- Paratrooper Beret + Silhouette -->
          <circle cx="80" cy="64" r="28" fill="#e2e8f0" />
          <path d="M48 54 C54 32, 108 30, 114 52 C98 46, 66 46, 48 54 Z" fill="#991b1b" stroke="#ffffff" stroke-width="3" />
          <path d="M36 138 C42 104, 118 104, 124 138" fill="#1e293b" stroke="#ffd600" stroke-width="4" stroke-linecap="round" />
          <polygon points="80,104 86,118 74,118" fill="#ffd600" />
        </svg>
      </div>
      <div id="s2-name-pill" class="badge-pill">KARL BUSHBY</div>
      <div id="s2-role-pill" class="badge-pill">FORMER BRITISH PARATROOPER</div>

      <!-- S3: Nov 1, 1998 — Punta Arenas, Chile -->
      <div id="s3-year-badge" class="badge-pill badge-red">NOV 1, 1998</div>
      <div id="s3-place-pill" class="badge-pill">PUNTA ARENAS, CHILE</div>

      <!-- S4: Expedition Cart & Few Hundred Dollars -->
      <div id="s4-row">
        <div id="s4-card-1" class="stat-card">
          <div class="stat-icon">
            <svg viewBox="0 0 64 64" width="52" height="52">
              <rect x="10" y="18" width="34" height="22" rx="4" fill="#ffd600" />
              <line x1="44" y1="24" x2="56" y2="16" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
              <circle cx="18" cy="48" r="7" fill="none" stroke="#ffffff" stroke-width="4" />
              <circle cx="38" cy="48" r="7" fill="none" stroke="#ffffff" stroke-width="4" />
            </svg>
          </div>
          <div>
            <div class="stat-text-main">1 EXPEDITION CART</div>
            <div class="stat-text-sub">PULLED ENTIRELY BY HAND</div>
          </div>
        </div>
        <div id="s4-card-2" class="stat-card">
          <div class="stat-icon">
            <svg viewBox="0 0 64 64" width="52" height="52">
              <circle cx="32" cy="32" r="24" fill="none" stroke="#00e676" stroke-width="4" />
              <text x="32" y="42" text-anchor="middle" fill="#00e676" font-size="32" font-weight="900">$</text>
            </svg>
          </div>
          <div>
            <div class="stat-text-main">FEW HUNDRED DOLLARS</div>
            <div class="stat-text-sub">STARTING BUDGET</div>
          </div>
        </div>
      </div>

      <!-- S5: Destination Hull, England -->
      <div id="s5-dest-pill" class="badge-pill badge-yellow">DESTINATION: HULL, ENGLAND</div>

      <!-- S6: 3D Tilted Map Slam Icons -->
      <div id="s6-title-pill" class="badge-pill badge-red">NO TRANSPORT ALLOWED</div>
      <div id="s6-icons-row">
        <div id="s6-hex-1" class="slam-hex">
          <svg viewBox="0 0 200 220" width="250" height="275">
            <polygon points="100,8 190,58 190,162 100,212 10,162 10,58" fill="#e53935" stroke="#ffffff" stroke-width="8" />
            <!-- Car -->
            <rect x="52" y="102" width="96" height="32" rx="8" fill="#ffffff" />
            <path d="M68 102 L82 76 L118 76 L132 102 Z" fill="#ffffff" />
            <circle cx="72" cy="136" r="11" fill="#0b132b" stroke="#ffffff" stroke-width="4" />
            <circle cx="128" cy="136" r="11" fill="#0b132b" stroke="#ffffff" stroke-width="4" />
            <line x1="42" y1="54" x2="158" y2="168" stroke="#0b132b" stroke-width="14" stroke-linecap="round" />
            <line x1="42" y1="54" x2="158" y2="168" stroke="#ffd600" stroke-width="7" stroke-linecap="round" />
          </svg>
        </div>
        <div id="s6-hex-2" class="slam-hex">
          <svg viewBox="0 0 200 220" width="250" height="275">
            <polygon points="100,8 190,58 190,162 100,212 10,162 10,58" fill="#e53935" stroke="#ffffff" stroke-width="8" />
            <!-- Plane -->
            <path d="M100 54 L112 96 L156 112 L156 124 L112 116 L110 144 L126 154 L126 164 L100 156 L74 164 L74 154 L90 144 L88 116 L44 124 L44 112 L88 96 Z" fill="#ffffff" />
            <line x1="42" y1="54" x2="158" y2="168" stroke="#0b132b" stroke-width="14" stroke-linecap="round" />
