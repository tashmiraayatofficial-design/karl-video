name: Unpack Zip and Render Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack single zip
        run: unzip -o uk-map-github-single-upload.zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Render video
        run: npm run render -- --concurrency=1 --timeout=120000

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: uk-map-video
          path: out/uk-map-video.mp4
          
