name: Render video
on: workflow_dispatch
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unzip project
        run: unzip -q ./*.zip
      - name: Install system libs
        run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 libgbm1 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2t64
      - name: Install and render
        working-directory: karl-journey
        run: |
          npm install --no-audit --no-fund
          npx remotion render src/index.ts Main out/video.mp4 --codec h264 --crf 17
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: karl-journey/out/video.mp4
